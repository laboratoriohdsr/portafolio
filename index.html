async function guardarDisponibilidad(){
  const motivo = (document.getElementById("dispMotivo")||{}).value || "";
  const cambios = [];
  pruebas.forEach(p=>{
    if(!(p.id in suspEdit)) return;
    const nuevo = suspEdit[p.id];
    if(nuevo === !!p.suspendida) return;
    const data = { suspendida: nuevo };
    if(nuevo){ if(motivo.trim()) data.motivoSuspension = motivo.trim(); }
    else data.motivoSuspension = "";
    cambios.push({id:p.id, data});
  });
  if(!cambios.length){ toast("No hay cambios por guardar"); return; }
  if(USA_FIREBASE){
    try{
      for(let i=0;i<cambios.length;i+=400){
        const batch = db.batch();
        cambios.slice(i,i+400).forEach(c=>batch.update(db.collection("pruebas").doc(c.id), c.data));
        await batch.commit();
      }
    }catch(e){ console.error(e); toast("Error al guardar", true); return; }
  }else{
    cambios.forEach(c=>{
      const i = pruebas.findIndex(x=>x.id===c.id);
      if(i>=0) pruebas[i] = Object.assign({}, pruebas[i], c.data);
    });
    guardarLocal(); renderLista();
  }
  suspEdit = {};
  toast(`${cambios.length} ${cambios.length===1?"prueba actualizada":"pruebas actualizadas"}`);
  renderDispBox();
}

/* Mueve un elemento de una lista hacia arriba (dir=-1) o abajo (dir=+1)
   y vuelve a dibujar la caja correspondiente. Sirve para servicios,
   tubos, laboratorios y áreas: así se ordenan como se verán al configurar. */
function moverItem(cual, i, dir){
  const mapa = {
    servicios:[serviciosEdit, renderServiciosBox],
    tubos:[tubosEdit, renderTubosBox],
    labs:[labsEdit, renderLabsBox],
    secciones:[seccionesEdit, renderSeccionesBox]
  };
  const par = mapa[cual]; if(!par) return;
  const [arr, render] = par;
  const j = i + dir;
  if(j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];   // intercambiar
  render();
}

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
    </button>
    <button class="orden-b" ${i===total-1?'disabled':''} onclick="moverItem('${cual}',${i},1)" aria-label="Bajar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>

function alternarModoInicio(el){
  el.classList.toggle("on");

function renderDestacadosBox(){
  const box = document.getElementById("destacadosBox");
  if(!box) return;
  if(modoInicioEdit !== "destacados"){ box.innerHTML = ""; return; }
  const lista = pruebas.slice().sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
  const tick = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>`;
  box.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span style="font-size:12.5px;font-weight:700;color:var(--ink-soft)">Pruebas en el inicio</span>
      <span style="font-size:12px;color:var(--primary);font-weight:700" id="destCount">${destacadosEdit.length} seleccionadas</span>

function renderDestacadosLista(){
  const cont = document.getElementById("destLista");
  if(!cont) return;
  const f = normalizar((document.getElementById("destFiltro")||{}).value || "");
  const tick = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>`;
  const lista = pruebas.slice()
    .sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""))
    .filter(p=>!f || normalizar((p.nombre||"")+" "+(p.cups||"")).includes(f));
  cont.innerHTML = lista.length ? lista.map(p=>`
    <div class="dest-item ${destacadosEdit.includes(p.id)?'on':''}" onclick="alternarDestacado('${p.id}')">
      <span class="tick">${tick}</span>
      <span class="dn">${esc(p.nombre)}</span>
      ${p.cups?`<span class="dc">${esc(p.cups)}</span>`:""}
    </div>`).join("")
    : '<p style="font-size:12.5px;color:var(--ink-faint);text-align:center;padding:14px">Sin coincidencias.</p>';
}
function alternarDestacado(id){
  const i = destacadosEdit.indexOf(id);
  if(i>=0) destacadosEdit.splice(i,1); else destacadosEdit.push(id);
  const c = document.getElementById("destCount");
  if(c) c.textContent = destacadosEdit.length + " seleccionadas";
  renderDestacadosLista();
}

function renderServiciosBox(){
  const box = document.getElementById("serviciosBox");
  if(!box) return;
  box.innerHTML = (serviciosEdit.length
    ? serviciosEdit.map((sv,i)=>`<div class="tubo-row">

      </div>`).join("")
    : '<p style="font-size:12.5px;color:var(--ink-faint);margin:0 0 10px">Aún no hay servicios.</p>')
    + `<button class="btn ghost" onclick="agregarServicio()" style="margin-top:11px">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Agregar servicio</button>
       <div class="hint" style="margin-top:8px">Si renombras o eliminas un servicio, el cambio se aplica también a las pruebas que lo tenían. No olvides <b>Guardar ajustes</b>.</div>`;
}
function editarServicio(i, val){ if(serviciosEdit[i]) serviciosEdit[i].n = val; }
function agregarServicio(){ serviciosEdit.push({n:"", orig:null}); renderServiciosBox(); }
function quitarServicio(i){ serviciosEdit.splice(i,1); renderServiciosBox(); }

async function guardarAjustes(){
  cfg.nombre = document.getElementById("cf_nombre").value.trim() || cfg.nombre;
  cfg.sub = document.getElementById("cf_sub").value.trim();
  cfg.logoUrl = document.getElementById("cf_logo").value.trim();
  cfg.modoInicio = modoInicioEdit;
  cfg.destacados = destacadosEdit.slice();

  // --- Servicios: detectar renombres y eliminaciones ---
  const servFinales = serviciosEdit.filter(sv=>(sv.n||"").trim());
  const renServ = {};   // nombre anterior -> nombre nuevo
  servFinales.forEach(sv=>{ if(sv.orig && sv.orig !== sv.n.trim()) renServ[sv.orig] = sv.n.trim(); });
  const servEliminados = (cfg.servicios||[]).filter(n => !servFinales.some(sv=>sv.orig===n));
  cfg.servicios = servFinales.map(sv=>sv.n.trim());

  // --- Tubos: detectar renombres y cambios de color ---
  // --- Laboratorios de referencia: renombres ---
  const labFinales = labsEdit.filter(L=>(L.n||"").trim());
  const renLab = {};
  labFinales.forEach(L=>{ if(L.orig && L.orig !== L.n.trim()) renLab[L.orig] = L.n.trim(); });
  cfg.laboratorios = labFinales.map(L=>L.n.trim());

  // --- Áreas / secciones: renombres y creación ---
  const secFinales = seccionesEdit.filter(S=>(S.n||"").trim());
  const renSec = {};
  secFinales.forEach(S=>{ if(S.orig && S.orig !== S.n.trim()) renSec[S.orig] = S.n.trim(); });
  // conserva el orden en que quedaron en la lista (sin alfabetizar)
  cfg.secciones = [...new Set(secFinales.map(S=>S.n.trim()))];

  const tubFinales = tubosEdit.filter(t=>(t.n||"").trim());
  const renTubo = {};       // nombre anterior -> {n, c}
  tubFinales.forEach(t=>{ if(t.orig) renTubo[t.orig] = {n:t.n.trim(), c:t.c}; });
  cfg.tubos = tubFinales.map(t=>({n:t.n.trim(), c:t.c}));

  const nueva = document.getElementById("cf_clave").value.trim();
  if(nueva) cfg.clave = nueva;
  const nuevaLab = document.getElementById("cf_claveLab").value.trim();
  if(nuevaLab) cfg.claveLab = nuevaLab;

  if(USA_FIREBASE){ try{ await db.collection("config").doc("general").set(cfg); }catch(e){ toast("Error al guardar", true); return; } }
  else{ guardarLocal(); }

  const tocadas = await propagarCambios(renServ, servEliminados, renTubo, renLab, renSec);
  aplicarCfg();
  toast(tocadas ? `Ajustes guardados · ${tocadas} ${tocadas===1?"prueba actualizada":"pruebas actualizadas"}` : "Ajustes guardados");
}

/* Aplica a las pruebas los cambios hechos en Ajustes:
   servicios renombrados o eliminados, y tubos renombrados o con nuevo color. */
async function propagarCambios(renServ, servEliminados, renTubo, renLab, renSec){
  const hayServ = Object.keys(renServ).length || servEliminados.length;
  const hayTubo = Object.keys(renTubo).length;
  const hayLab  = renLab && Object.keys(renLab).length;
  const haySec  = renSec && Object.keys(renSec).length;
  if(!hayServ && !hayTubo && !hayLab && !haySec) return 0;

  const cambios = [];   // {id, data}
  pruebas.forEach(p=>{
    const upd = {};

    if(hayServ && Array.isArray(p.servicios)){
      const antes = p.servicios.join("|");
      const ahora = p.servicios
        .map(x => renServ[x] || x)
        .filter(x => !servEliminados.includes(x))
        .filter((x,i,arr) => arr.indexOf(x)===i);
      if(ahora.join("|") !== antes) upd.servicios = ahora;
    }

    if(hayTubo){
      const ts = tubosDe(p);
      if(ts.length){
        let cambio = false;
        const nuevos = ts.map(t=>{
          if(renTubo[t.n]){ cambio = true; return {n:renTubo[t.n].n, c:renTubo[t.n].c}; }
          return t;
        });
        if(cambio){
          upd.tubos = nuevos;
          upd.tubo = nuevos[0] ? nuevos[0].n : "";       // compatibilidad
          upd.tuboColor = nuevos[0] ? nuevos[0].c : "";  // compatibilidad
        }
      }
    }

    if(hayLab && p.laboratorioRef && renLab[p.laboratorioRef])
      upd.laboratorioRef = renLab[p.laboratorioRef];

    if(haySec && p.seccion && renSec[p.seccion])
      upd.seccion = renSec[p.seccion];

    if(Object.keys(upd).length) cambios.push({id:p.id, data:upd});
  });

  if(!cambios.length) return 0;

  if(USA_FIREBASE){
    try{
      const batch = db.batch();
      cambios.forEach(c=>batch.update(db.collection("pruebas").doc(c.id), c.data));
      await batch.commit();
    }catch(e){ console.error(e); toast("No se pudieron actualizar las pruebas", true); return 0; }
  }else{
    cambios.forEach(c=>{
      const i = pruebas.findIndex(x=>x.id===c.id);
      if(i>=0) pruebas[i] = Object.assign({}, pruebas[i], c.data);
    });
    guardarLocal(); renderLista();
  }
  return cambios.length;
}

/* ====================== LOGIN POR NIVELES ======================
   LABORATORIO -> indicaciones internas, hemocomponentes y avisos
   ADMINISTRADOR -> todo lo anterior + pruebas, ajustes y claves     */
let nivelPedido = "lab";
function pedirClave(accion, msg, min){
  nivelPedido = min || "lab";
  if(puede(nivelPedido)){ accion(); return; }
  accionTrasLogin = accion;
  document.getElementById("loginMsg").textContent = msg ||
    (nivelPedido==="admin" ? "Ingresa la clave de administrador." : "Ingresa la clave del laboratorio.");
  document.getElementById("pwInput").value = "";
  abrir(document.getElementById("loginSheet"));
  setTimeout(()=>document.getElementById("pwInput").focus(), 300);
}
function intentarLogin(){
  const v = document.getElementById("pwInput").value;
  const cAdmin = cfg.clave || CLAVE_POR_DEFECTO;
  const cLab   = cfg.claveLab || CLAVE_LAB_POR_DEFECTO;
  let ok = false;
  if(v === cAdmin){ nivel = "admin"; ok = true; }
  else if(v === cLab && nivelPedido === "lab"){ nivel = "lab"; ok = true; }
  else if(v === cLab && nivelPedido === "admin"){
    toast("Esa clave no tiene permisos de administrador", true);
    document.getElementById("pwInput").value = ""; return;
  }
  if(ok){
    cerrar();
    const a = accionTrasLogin; accionTrasLogin = null;
    setTimeout(()=>{ if(a) a(); }, 260);
  }else{
    toast("Clave incorrecta", true);
    document.getElementById("pwInput").value = "";
  }
}

/* ====================== UTILIDADES UI ====================== */
let sheetActual = null;
function abrir(sheet){
  document.querySelectorAll(".sheet.on").forEach(s=>s.classList.remove("on"));
  document.getElementById("scrim").classList.add("on");
  // El cuerpo del panel siempre arranca arriba
  sheet.querySelectorAll(".sheet-body").forEach(b=>{ b.scrollTop = 0; });
  requestAnimationFrame(()=>sheet.classList.add("on"));
  sheetActual = sheet;
  document.body.classList.add("no-scroll");
}
function cerrar(){
  document.querySelectorAll(".sheet.on").forEach(s=>s.classList.remove("on"));
  document.getElementById("scrim").classList.remove("on");
  sheetActual = null;
  document.body.classList.remove("no-scroll");
  document.body.style.overflow = ""; // por si quedó de una versión anterior
}
let toastTimer;
function toast(msg, err){
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast on" + (err?" err":"");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("on"), 2400);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Devuelve la lista de tubos/recipientes de una prueba (hasta 3), compatible
// con el dato antiguo de un solo tubo (p.tubo / p.tuboColor).
function tubosDe(p){
  if(Array.isArray(p.tubos) && p.tubos.length) return p.tubos.filter(t=>t && t.n);
  if(p.tubo) return [{n:p.tubo, c:p.tuboColor||""}];
  return [];
}

/* Evita que la app "brinque" cuando se abre el teclado sobre el buscador:
   lo sube al tope (donde ya queda fijo, igual que al hacer scroll) de una
   sola vez, en lugar de dejar que el navegador lo desplace a medias. */
// ¿Es un dispositivo con teclado en pantalla? (móvil/tablet táctil)
function esTactil(){
  return window.matchMedia("(pointer:coarse)").matches || 'ontouchstart' in window;
}
// Sube la vista hasta el buscador. Solo en táctil, porque en PC el teclado
// no tapa nada y hacer scroll causa el brinco de la info de arriba.
function fijarBuscador(){
  if(!esTactil()) return;               // en computador no se toca el scroll
  const wrap = document.getElementById("searchWrap");
  if(!wrap) return;
  const top = wrap.getBoundingClientRect().top;
  if(top > 1) window.scrollBy({top, left:0, behavior:"auto"});
}

/* ====================== PWA: INSTALACIÓN ====================== */
(function(){
  const CLAVE = "lab_instalar_pospuesto";
  const box   = document.getElementById("instalarBox");
  const txt   = document.getElementById("instalarTxt");
  const acc   = document.getElementById("instalarAcc");
  let evento  = null;

  const enApp = window.matchMedia("(display-mode: standalone)").matches
                || window.navigator.standalone === true;
  const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent)
                || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const esSafari = /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(navigator.userAgent);

  function pospuesto(){
    try{
      const t = parseInt(localStorage.getItem(CLAVE) || "0", 10);
      return t && (Date.now() - t) < 1000 * 60 * 60 * 24 * 14;   // 14 días
    }catch(e){ return false; }
  }
  function posponer(){
    try{ localStorage.setItem(CLAVE, String(Date.now())); }catch(e){}
    ocultar();
  }
  function mostrar(){ setTimeout(()=>box.classList.add("on"), 1600); }
  function ocultar(){ box.classList.remove("on"); }

  document.getElementById("instalarNo").addEventListener("click", posponer);
  document.getElementById("instalarNo2").addEventListener("click", posponer);

  document.getElementById("instalarSi").addEventListener("click", async ()=>{
    if(!evento) return;
    ocultar();
    evento.prompt();
    try{
      const r = await evento.userChoice;
      if(r && r.outcome === "accepted") toast("Instalando la app…");
      else posponer();
    }catch(e){}
    evento = null;
  });

  // Android, Chrome y Edge (también en Windows): instalación en un toque
  window.addEventListener("beforeinstallprompt", e=>{
    e.preventDefault();
    evento = e;
    if(!enApp && !pospuesto()) mostrar();
  });

  window.addEventListener("appinstalled", ()=>{
    ocultar();
    try{ localStorage.removeItem(CLAVE); }catch(e){}
    toast("Portafolio Lab quedó instalado");
  });

  // iPhone y iPad: Safari no ofrece instalación automática, se explica el paso
  if(esIOS && esSafari && !enApp && !pospuesto()){
    const compartir = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3"/><path d="m8 7 4-4 4 4"/><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/></svg>`;
    txt.innerHTML = `Toca <span class="ios-paso">${compartir} Compartir</span> y luego <span class="ios-paso">Añadir a pantalla de inicio</span>.`;
    acc.innerHTML = `<button class="no" id="iosOk">Entendido</button>`;
    document.getElementById("iosOk").addEventListener("click", posponer);
    mostrar();
  }
})();

/* Si algo falla en el arranque, el spinner no se queda pegado */

/* ---------- Service worker (funciona sin conexión) ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js")
      .then(reg=>{
        // si hay una versión nueva publicada, se activa al recargar
        reg.addEventListener("updatefound", ()=>{
          const nuevo = reg.installing;
          if(!nuevo) return;
          nuevo.addEventListener("statechange", ()=>{
            if(nuevo.state === "installed" && navigator.serviceWorker.controller)
              console.log("Portafolio Lab: hay una versión nueva disponible.");
          });
        });
      })
      .catch(err=>console.warn("No se pudo registrar el service worker:", err));
  });
}
