<title>Portafolio de Pruebas · Laboratorio HDSR</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F0F8FA; --surface:#FFFFFF; --surface-2:#F6FBFC;
    --ink:#0E2830; --ink-soft:#4E6A72; --ink-faint:#8199A0;
    --line:#DCEAEE; --line-strong:#C3DBE1;
    --primary:#077F98; --primary-deep:#0A6E82; --primary-tint:#DFF3F7;
    --accent:#0CC0DF; --accent-deep:#0097B2; --accent-mid:#049FBB;
    --blood:#B0242A; --blood-tint:#FBEAEA;
    --ok:#1C8A57; --ok-tint:#E4F3EB;
    --warn:#B77400; --warn-tint:#FBF0DC;
    --none:#8398A0; --none-tint:#EBF2F4;
    --shadow:0 1px 2px rgba(14,40,48,.05), 0 8px 24px rgba(14,40,48,.06);
    --shadow-lg:0 12px 40px rgba(14,40,48,.16);
    --r:14px; --r-sm:10px; --r-lg:20px;
    --wrap:960px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mono{font-family:"Space Mono",ui-monospace,monospace}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
  input,select,textarea{font-family:inherit; font-size:16px}
  ::selection{background:var(--primary-tint)}
  body.no-scroll{overflow:hidden}

  .wrap{max-width:var(--wrap); margin:0 auto; padding:0 18px}

  /* ---------- Header ---------- */
  header.top{
    background:linear-gradient(180deg,var(--accent-deep),var(--accent-mid));
    color:#fff; padding:calc(env(safe-area-inset-top) + 18px) 0 22px;
    position:relative; overflow:hidden;
  }
  header.top::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.10), transparent 60%);
    pointer-events:none;
  }
  .top-row{display:flex; align-items:center; gap:14px; position:relative}
  .logo{
    width:54px; height:54px; border-radius:13px; flex-shrink:0;
    background:#fff; display:grid; place-items:center; overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .logo img{width:100%; height:100%; object-fit:contain}
  .logo svg{width:64%; height:64%}
  .titles{min-width:0; flex:1}
  .eyebrow{
    font-family:"Space Mono",monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:rgba(255,255,255,.88); margin:0 0 2px;
    text-shadow:0 1px 2px rgba(0,40,46,.22);
  }
  h1.brand{
    font-family:"Archivo",sans-serif; font-weight:800; font-size:20px;
    line-height:1.12; margin:0; letter-spacing:-.01em;
    text-shadow:0 1px 3px rgba(0,40,46,.18);
  }
  .subbrand{font-size:12.5px; color:rgba(255,255,255,.92); margin-top:3px; text-shadow:0 1px 2px rgba(0,40,46,.2)}
  .gear{
    width:40px; height:40px; border-radius:11px; flex-shrink:0;
    background:rgba(255,255,255,.16); display:grid; place-items:center;
    color:#fff; transition:background .15s;
  }
  .gear:active{background:rgba(255,255,255,.3)}
  .gear svg{width:21px; height:21px}

  /* ---------- Reserva de sangre ---------- */
  .blood{
    margin-top:18px; background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16); border-radius:var(--r);
    padding:13px 14px 14px; position:relative;
  }
  .blood-head{display:flex; align-items:center; gap:8px; margin-bottom:11px}
  .blood-drop{width:17px; height:17px; color:#FFD7D3}
  .blood-title{font-family:"Archivo",sans-serif; font-weight:700; font-size:13.5px; letter-spacing:.02em; flex:1; color:#fff}
  .blood-edit{
    font-size:11px; font-weight:600; color:#fff; background:rgba(255,255,255,.16);
    padding:5px 10px; border-radius:20px; display:flex; align-items:center; gap:5px;
  }
  .blood-edit svg{width:13px; height:13px}
  /* Total destacado */
  .blood-total{display:flex; align-items:center; gap:11px; margin-bottom:13px}
  .blood-total .num{font-family:"Archivo",sans-serif; font-weight:800; font-size:38px; line-height:1; color:#fff; letter-spacing:-.02em; display:block}
  .blood-total .lbl{font-size:12.5px; color:rgba(255,255,255,.92); line-height:1.3; max-width:140px; text-shadow:0 1px 2px rgba(0,40,46,.2)}
  /* O+ / O- grandes */
  .blood-primary{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:9px}
  .bg-big{background:#fff; border-radius:13px; padding:11px 10px 10px; text-align:center; border:2px solid transparent; position:relative}
  .bg-big .bg-type{font-family:"Archivo",sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); line-height:1.1; letter-spacing:-.01em}
  .bg-big .bg-count{font-family:"Archivo",sans-serif; font-weight:800; font-size:30px; line-height:1.05; margin-top:2px}
  .bg-big .bg-unit{font-size:9.5px; color:var(--ink-faint); letter-spacing:.03em; text-transform:uppercase}
  /* Resto pequeños */
  .blood-rest{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
  .bg-sm{background:rgba(255,255,255,.92); border-radius:9px; padding:6px 2px 5px; text-align:center; border:1.5px solid transparent}
  .bg-sm .bg-type{font-family:"Space Mono",monospace; font-weight:700; font-size:11px; color:var(--ink); line-height:1}
  .bg-sm .bg-count{font-family:"Archivo",sans-serif; font-weight:800; font-size:16px; line-height:1.1; margin-top:1px}
  /* estados comunes */
  [data-st="ok"]{border-color:var(--ok)}   [data-st="ok"] .bg-count{color:var(--ok)}
  [data-st="low"]{border-color:var(--warn)} [data-st="low"] .bg-count{color:var(--warn)}
  .bg-big[data-st="none"], .bg-sm[data-st="none"]{background:var(--none-tint)} [data-st="none"] .bg-count{color:var(--none)}
  .blood-meta{font-size:11px; color:rgba(255,255,255,.86); margin-top:12px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; text-shadow:0 1px 2px rgba(0,40,46,.18)}
  .blood-dot{width:7px;height:7px;border-radius:50%;display:inline-block}

  /* ---------- Buscador ---------- */
  .search-wrap{position:sticky; top:0; z-index:30; background:var(--paper); padding:14px 0 10px; scroll-margin-top:0}
  .search{
    display:flex; align-items:center; gap:10px; background:var(--surface);
    border:1.5px solid var(--line-strong); border-radius:var(--r);
    padding:0 14px; box-shadow:var(--shadow); transition:border-color .15s;
  }
  .search{cursor:text}
  .search:focus-within{border-color:var(--primary)}
  .search svg{width:20px; height:20px; color:var(--ink-faint); flex-shrink:0}
  .search input{border:none; outline:none; background:none; padding:14px 0; flex:1; color:var(--ink)}
  .search input::placeholder{color:var(--ink-faint)}
  .search .clear{color:var(--ink-faint); font-size:22px; line-height:1; padding:4px; display:none}
  .search.has-text .clear{display:block}

  /* Barra de filtros: botón único + chips activos */
  .filtro-barra{display:flex; align-items:center; gap:8px; padding:2px 0 4px; flex-wrap:wrap}
  .filtro-btn{
    display:inline-flex; align-items:center; gap:7px; flex-shrink:0;
    font-size:13px; font-weight:600; color:var(--ink-soft);
    background:var(--surface); border:1px solid var(--line-strong); border-radius:11px;
    padding:8px 13px; transition:all .14s;
  }
  .filtro-btn svg{width:16px; height:16px}
  .filtro-btn.con-filtros{color:var(--primary-deep); border-color:var(--primary); background:var(--primary-tint)}
  .filtro-btn:active{transform:scale(.97)}
  .filtro-badge{
    min-width:18px; height:18px; padding:0 5px; border-radius:9px; display:none; place-items:center;
    background:var(--accent); color:#fff; font-size:11px; font-weight:800;
  }
  .filtro-chips-activos{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; flex:1}
  .filtro-chips-activos::-webkit-scrollbar{display:none}
  .chip-activo{
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap; flex-shrink:0;
    font-size:12px; font-weight:600; color:var(--primary-deep);
    background:var(--primary-tint); border:1px solid transparent; border-radius:16px;
    padding:5px 8px 5px 11px;
  }
  .chip-activo svg{width:13px; height:13px; opacity:.7}
  .chip-activo:active{opacity:.7}

  /* Panel desplegable de filtros */
  .filtro-panel{
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height .28s ease, opacity .2s ease, margin .28s ease;
    background:var(--surface); border-radius:var(--r); margin:0;
  }
  .filtro-panel.abierto{
    max-height:70vh; overflow-y:auto; opacity:1; margin:8px 0 4px;
    border:1px solid var(--line); box-shadow:var(--shadow); padding:6px 4px 4px;
  }
  .fp-grupo{padding:10px 14px}
  .fp-titulo{
    font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:9px; display:flex; align-items:center; gap:8px;
  }
  .fp-multi{font-weight:600; letter-spacing:0; text-transform:none; font-size:11px; color:var(--ink-faint); opacity:.8}
  .fp-opts{display:flex; flex-wrap:wrap; gap:7px}
  .fp-op{
    font-size:12.5px; font-weight:600; color:var(--ink-soft);
    background:var(--surface-2); border:1.5px solid transparent; border-radius:18px;
    padding:7px 13px; transition:all .12s;
  }
  .fp-op.on{background:var(--primary-tint); border-color:var(--primary); color:var(--primary-deep)}
  .fp-op:active{transform:scale(.97)}
  .fp-pie{
    display:flex; gap:9px; padding:12px 14px 8px; margin-top:2px;
    border-top:1px solid var(--line); position:sticky; bottom:0; background:var(--surface);
  }
  .fp-limpiar{flex:1; padding:11px; border-radius:11px; font-weight:600; font-size:13.5px;
    color:var(--ink-soft); background:var(--surface-2)}
  .fp-listo{flex:1; padding:11px; border-radius:11px; font-weight:700; font-size:13.5px;
    color:#fff; background:var(--primary)}
  .fp-listo:active{background:var(--primary-deep)}

  .btn-eliminar{
    width:100%; margin-top:10px; padding:13px; border-radius:var(--r-sm);
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-weight:700; font-size:14px; color:var(--blood);
    background:var(--blood-tint); border:1px solid color-mix(in srgb, var(--blood) 30%, transparent);
  }
  .btn-eliminar svg{width:18px; height:18px}
  .btn-eliminar:active{transform:scale(.99); background:color-mix(in srgb, var(--blood) 16%, var(--surface))}

  .count-line{font-size:12px; color:var(--ink-faint); padding:2px 2px 10px}

  /* ---------- Lista de pruebas ---------- */
  .list{display:flex; flex-direction:column; gap:9px; padding-bottom:40px}
  .test{
    cursor:pointer;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 15px; box-shadow:var(--shadow); transition:transform .08s, border-color .12s;
    text-align:left; width:100%; display:block;
  }
  .test:active{transform:scale(.992); border-color:var(--line-strong)}
  .test-top{display:flex; align-items:flex-start; gap:10px}
  .test-name{font-family:"Archivo",sans-serif; font-weight:700; font-size:15.5px; line-height:1.22; flex:1; letter-spacing:-.005em}
  .cups{
    font-family:"Space Mono",monospace; font-size:12px; font-weight:700; color:var(--primary);
    background:var(--primary-tint); padding:3px 8px; border-radius:7px; white-space:nowrap; flex-shrink:0;
  }
  .test-badges{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
  .badge{font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; display:inline-flex; align-items:center; gap:4px}
  .badge svg{width:12px; height:12px}
  .b-sec{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line)}
  .b-here{background:var(--ok-tint); color:var(--ok)}
  .b-ref{background:var(--warn-tint); color:var(--warn)}
  .b-time{background:var(--primary-tint); color:var(--primary-deep)}
  .b-days{background:#EEE9FA; color:#5B3FA6}

  /* Indicaciones internas del laboratorio (bloqueadas) */
  .lab-block{margin:13px 0; border-radius:13px; border:1px solid var(--line); background:var(--surface-2); padding:14px}
  .lab-head{display:flex; align-items:center; gap:9px; margin-bottom:9px}
  .lab-head .ic{width:32px; height:32px; border-radius:9px; background:var(--primary-tint); color:var(--primary); display:grid; place-items:center; flex-shrink:0}
  .lab-head .ic svg{width:17px; height:17px}
  .lab-head .tx{flex:1; min-width:0}
  .lab-title{font-family:"Archivo",sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); line-height:1.2}
  .lab-sub{font-size:11.5px; color:var(--ink-faint); margin-top:1px}
  .lab-btn{width:100%; background:var(--primary); color:#fff; font-weight:700; font-size:13.5px; padding:11px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; gap:7px}
  .lab-btn svg{width:15px; height:15px}
  .lab-open{font-size:14.5px; color:var(--ink); line-height:1.5; white-space:pre-wrap}

  /* Días de procesamiento en el detalle */
  .days-block{margin:13px 0; border-radius:13px; padding:14px; border:1px solid #DED5F5; background:#F6F3FD}
  .days-head{display:flex; align-items:center; gap:8px; font-family:"Archivo",sans-serif; font-weight:700; font-size:13.5px; color:#4A3A85; margin-bottom:11px}
  .days-head svg{width:17px; height:17px; color:#5B3FA6}
  .days-after{margin-top:9px; padding-top:9px; border-top:1px dashed #DED5F5; font-size:13.5px; color:var(--ink); line-height:1.45}
  .days-after b{color:#4A3A85}

  /* Selector de días en el editor */
  .day-picker{display:flex; gap:6px; flex-wrap:wrap}
  .day-pick{padding:10px 15px; border-radius:20px; display:inline-flex; align-items:center; justify-content:center; font-weight:600; font-size:13px; background:var(--surface); color:var(--ink-soft); border:1.5px solid var(--line-strong); user-select:none}
  .day-pick.on{background:var(--primary); color:#fff; border-color:var(--primary)}
  .b-cold{background:#E7F0FB; color:#215D9C}
  .b-freeze{background:#E9EAFB; color:#4A3F9C}
  .b-urg{background:var(--blood-tint); color:var(--blood)}
  .b-lock{background:var(--warn-tint); color:var(--warn)}

  /* Bloque de servicios en el detalle */
  .svc-block{margin:13px 0; border-radius:13px; padding:14px; border:1px solid var(--line); background:var(--surface-2)}
  .svc-block.excl{background:var(--warn-tint); border-color:#F0DCA8}
  .svc-head{display:flex; align-items:center; gap:8px; font-family:"Archivo",sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); margin-bottom:11px}
  .svc-head svg{width:17px; height:17px; color:var(--primary)}
  .svc-block.excl .svc-head{color:var(--warn)} .svc-block.excl .svc-head svg{color:var(--warn)}
  .svc-chips{display:flex; flex-wrap:wrap; gap:7px}
  .svc-chip{font-size:12.5px; font-weight:600; background:#fff; border:1px solid var(--line-strong); border-radius:20px; padding:6px 12px; color:var(--ink)}
  .svc-block.excl .svc-chip{border-color:#E4C98A; color:#8A5A00}
  .svc-note{font-size:11.5px; color:var(--warn); margin-top:9px; font-weight:600}

  /* Selector de servicios en el editor */
  .svc-picker{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:4px}
  .svc-opt{display:flex; align-items:center; gap:8px; border:1.5px solid var(--line-strong); border-radius:11px; padding:9px 12px; font-size:13.5px; font-weight:600; color:var(--ink-soft); user-select:none}
  .svc-opt.on{background:var(--primary-tint); border-color:var(--primary); color:var(--primary-deep)}
  .svc-opt .tick{width:19px; height:19px; border-radius:6px; border:1.5px solid var(--line-strong); display:grid; place-items:center; flex-shrink:0}
  .svc-opt.on .tick{background:var(--primary); border-color:var(--primary)}
  .svc-opt .tick svg{width:12px; height:12px; color:#fff; display:none}
  .svc-opt.on .tick svg{display:block}

  /* Unidades reservadas para urgencia vital */
  .bg-res{
    position:absolute; top:-7px; right:-6px; min-width:22px; height:22px; padding:0 6px;
    border-radius:12px; background:var(--blood); color:#fff; display:inline-flex;
    align-items:center; justify-content:center; gap:3px;
    font-family:"Archivo",sans-serif; font-weight:800; font-size:11.5px;
    box-shadow:0 1px 4px rgba(0,0,0,.28); border:2px solid #fff;
  }
  .bg-res svg{width:10px; height:10px}
  .bg-sm{position:relative}
  .bg-sm .bg-res{top:-6px; right:-5px; min-width:19px; height:19px; font-size:10.5px; border-width:1.5px}
  .bg-sm .bg-res svg{display:none}

  .reserva-nota{
    margin-top:11px; display:flex; gap:9px; align-items:flex-start;
    background:rgba(176,36,42,.22); border:1px solid rgba(255,255,255,.28);
    border-left:4px solid #FF8A8A; border-radius:11px; padding:10px 12px;
  }
  .reserva-nota .ic{
    width:24px; height:24px; border-radius:7px; background:#FF8A8A; color:#5E1114;
    display:grid; place-items:center; flex-shrink:0;
  }
  .reserva-nota .ic svg{width:14px; height:14px}
  .reserva-nota .tx{flex:1; min-width:0; color:#fff}
  .reserva-nota .t1{font-family:"Archivo",sans-serif; font-weight:800; font-size:12px;
    letter-spacing:.06em; text-transform:uppercase; color:#FFD9D9; margin-bottom:2px}
  .reserva-nota .t2{font-size:13px; line-height:1.4}
  .reserva-nota b{font-weight:700}

  /* Editor de la reserva */
  .be-item .res-lbl{font-size:11px; color:var(--ink-faint); margin-left:auto; margin-right:5px; white-space:nowrap}
  .be-item input.res{width:52px; border:1.5px solid #E4B5B5; background:#FDF4F4; color:var(--blood);
    border-radius:8px; padding:8px 4px; text-align:center; font-weight:700; font-family:"Archivo",sans-serif}

  /* Invitación a instalar la app */
  .instalar{
    position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 12px);
    z-index:150; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; box-shadow:var(--shadow-lg); padding:14px;
    display:flex; gap:12px; align-items:center;
    transform:translateY(140%); transition:transform .32s cubic-bezier(.32,.72,0,1);
  }
  .instalar.on{transform:translateY(0)}
  @media(min-width:640px){ .instalar{left:auto; right:20px; width:390px} }
  .instalar img{width:46px; height:46px; border-radius:11px; flex-shrink:0; box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .instalar .tx{flex:1; min-width:0}
  .instalar .t1{font-family:"Archivo",sans-serif; font-weight:800; font-size:14px; line-height:1.2}
  .instalar .t2{font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.35}
  .instalar .acc{display:flex; gap:7px; margin-top:10px}
  .instalar button{
    font-size:13px; font-weight:700; padding:9px 14px; border-radius:9px;
    background:var(--primary); color:#fff;
  }
  .instalar button.no{background:var(--surface-2); color:var(--ink-soft); border:1px solid var(--line)}
  .instalar .cerrar{
    position:absolute; top:8px; right:9px; width:26px; height:26px; border-radius:50%;
    background:var(--surface-2); color:var(--ink-faint); font-size:16px; line-height:1;
    display:grid; place-items:center; padding:0;
  }
  .ios-paso{display:inline-flex; align-items:center; gap:4px; font-weight:600; color:var(--ink)}
  .ios-paso svg{width:14px; height:14px; vertical-align:-2px}

  /* Prueba suspendida */
  .test.susp{opacity:.72; border-style:dashed}
  .b-susp{background:#FBE3E3; color:#A02020}
  .susp-block{margin:0 0 14px; border-radius:13px; padding:13px 14px; display:flex; gap:11px;
    background:#FDECEC; border:1.5px solid #F2C2C2; border-left:5px solid var(--blood)}
  .susp-block .ic{width:30px;height:30px;border-radius:9px;background:var(--blood);color:#fff;display:grid;place-items:center;flex-shrink:0}
  .susp-block .ic svg{width:17px;height:17px}
  .susp-block .tt{font-family:"Archivo",sans-serif;font-weight:800;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--blood);margin-bottom:2px}
  .susp-block .ms{font-size:14px;color:#5E1A1D;line-height:1.45}

  .sec-count{
    min-width:26px; text-align:center; font-size:12px; font-weight:700;
    color:var(--ink-soft); background:var(--surface-2); border-radius:8px; padding:5px 8px;
    flex-shrink:0;
  }

  /* Filtro de estado (procesando / no disponibles) */
  .estado-filtro{display:flex; gap:7px; margin:0 0 10px; flex-wrap:wrap}
  .estado-filtro:empty{display:none}
  .seg{
    padding:8px 15px; border-radius:20px; font-size:13px; font-weight:600;
    background:var(--surface-2); color:var(--ink-soft); border:1.5px solid transparent;
  }
  .seg.on{background:var(--accent); color:#fff; border-color:var(--accent)}

  /* Separador entre procesando y no disponibles en la lista */
  .sep-susp{
    display:flex; align-items:center; gap:11px; margin:20px 2px 12px;
    color:var(--blood); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  }
  .sep-susp::before, .sep-susp::after{content:""; flex:1; height:1px; background:color-mix(in srgb, var(--blood) 28%, transparent)}
  .sep-susp svg{width:15px; height:15px}

  /* Atajos de disponibilidad */
  .atajo-row{display:flex; flex-direction:column; gap:8px; margin:0 0 12px}
  .atajo{
    display:flex; align-items:center; gap:9px; width:100%; padding:13px 14px;
    border-radius:12px; border:1.5px solid color-mix(in srgb, var(--blood) 35%, transparent);
    background:var(--danger-tint, #FBEAEA); color:var(--blood);
    font-weight:700; font-size:14px; text-align:left;
  }
  .atajo:active{transform:scale(.99)}
  .atajo svg{width:18px; height:18px; flex-shrink:0}
  .atajo.ok{
    border-color:color-mix(in srgb, var(--ok, #1C8A57) 35%, transparent);
    background:#E4F3EB; color:var(--ok, #1C8A57);
  }

  /* Selector de disponibilidad */
  .disp-lista{max-height:300px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px}
  .disp-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;user-select:none}
  .disp-item:hover{background:var(--surface-2)}
  .disp-item .tick{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex-shrink:0}
  .disp-item .tick svg{width:12px;height:12px;color:#fff;display:none}
  .disp-item.on .tick{background:var(--blood);border-color:var(--blood)}
  .disp-item.on .tick svg{display:block}
  .disp-item.on .dn{color:var(--blood)}
  .disp-item .dn{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .disp-item .dc{font-family:"Space Mono",monospace;font-size:11.5px;color:var(--ink-faint);flex-shrink:0}

  /* Tubos con color */
  .tubo-val{display:inline-flex; align-items:center; gap:8px}
  .tubo-plus{color:var(--ink-faint); font-weight:700}
  .tubo-dot{width:13px; height:13px; border-radius:50%; flex-shrink:0; border:1.5px solid rgba(0,0,0,.14)}
  .tubo-nom{font-weight:700}
  /* Editor de tubos en Ajustes */
  .tubo-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .orden-btns{display:flex; flex-direction:column; gap:2px; flex-shrink:0}
  .orden-b{
    width:26px; height:20px; border-radius:6px; display:grid; place-items:center;
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft);
  }
  .orden-b svg{width:14px; height:14px}
  .orden-b:disabled{opacity:.3}
  .orden-b:active:not(:disabled){background:var(--primary-tint); color:var(--primary-deep)}
  .tubo-row:last-of-type{border-bottom:none}
  .tubo-row input[type=color]{width:38px; height:34px; border:1px solid var(--line-strong); border-radius:8px; padding:2px; background:var(--surface); flex-shrink:0; cursor:pointer}
  .tubo-row input[type=text]{flex:1; min-width:0; border:1.5px solid var(--line-strong); border-radius:9px; padding:9px 11px; font-size:13.5px}
  .color-field{display:flex; gap:10px; align-items:center}
  .color-field input[type=color]{width:46px; height:44px; border:1px solid var(--line-strong); border-radius:10px; padding:2px; background:var(--surface); flex-shrink:0; cursor:pointer}

  /* Selector de pruebas destacadas */
  .dest-lista{max-height:260px; overflow-y:auto; overscroll-behavior:contain; border:1px solid var(--line); border-radius:var(--r-sm); padding:4px}
  .dest-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; cursor:pointer; user-select:none}
  .dest-item:hover{background:var(--surface-2)}
  .dest-item .tick{width:19px; height:19px; border-radius:6px; border:1.5px solid var(--line-strong); display:grid; place-items:center; flex-shrink:0}
  .dest-item .tick svg{width:12px; height:12px; color:#fff; display:none}
  .dest-item.on .tick{background:var(--primary); border-color:var(--primary)}
  .dest-item.on .tick svg{display:block}
  .dest-item .dn{flex:1; min-width:0; font-size:13.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .dest-item .dc{font-family:"Space Mono",monospace; font-size:11.5px; color:var(--ink-faint); flex-shrink:0}

  /* Chips de servicios en Ajustes */

  .empty{text-align:center; padding:50px 20px; color:var(--ink-faint)}
  .empty svg{width:40px; height:40px; margin-bottom:12px; opacity:.5}
  .empty h3{font-family:"Archivo",sans-serif; color:var(--ink-soft); margin:0 0 4px; font-size:16px}

  /* ---------- Modal / hoja inferior ---------- */
  .scrim{position:fixed; inset:0; background:rgba(21,36,32,.5); backdrop-filter:blur(3px); z-index:100; opacity:0; pointer-events:none; transition:opacity .22s}
  .scrim.on{opacity:1; pointer-events:auto}
  /* Panel: solo el cuerpo hace scroll (evita el bloqueo de scroll en escritorio) */
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:101; background:var(--surface);
    border-radius:var(--r-lg) var(--r-lg) 0 0; max-height:92vh;
    display:flex; flex-direction:column; overflow:hidden;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1), visibility .28s;
    box-shadow:var(--shadow-lg); visibility:hidden;
  }
  .sheet.on{transform:translateY(0); visibility:visible}
  @media(min-width:640px){
    .sheet{left:50%; right:auto; bottom:auto; top:50%; width:560px; max-width:92vw;
      border-radius:var(--r-lg); transform:translate(-50%,-46%) scale(.97); opacity:0; max-height:88vh;
      transition:transform .22s ease, opacity .22s ease, visibility .22s}
    .sheet.on{transform:translate(-50%,-50%) scale(1); opacity:1}
  }
  .grab{width:38px; height:4px; background:var(--line-strong); border-radius:2px; margin:9px auto 2px; flex-shrink:0}
  @media(min-width:640px){.grab{display:none}}
  .sheet-head{position:relative; background:var(--surface); padding:16px 20px 12px; border-bottom:1px solid var(--line); flex-shrink:0}
  .sheet-head .x{position:absolute; top:14px; right:16px; width:34px; height:34px; border-radius:50%; background:var(--surface-2); color:var(--ink-soft); font-size:20px; display:grid; place-items:center; cursor:pointer}
  .sheet-head .edit-fab{right:58px; background:var(--primary-tint); color:var(--primary-deep)}
  .sheet-head .edit-fab svg{width:16px; height:16px}
  .sheet-title{font-family:"Archivo",sans-serif; font-weight:800; font-size:19px; line-height:1.18; padding-right:40px; letter-spacing:-.01em}
  .sheet-sub{margin-top:5px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .sheet-body{
    padding:6px 20px calc(env(safe-area-inset-bottom) + 24px);
    flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
  }

  .field{padding:13px 0; border-bottom:1px solid var(--line); display:flex; gap:13px}
  .field:last-child{border-bottom:none}
  .field-ic{width:34px; height:34px; border-radius:9px; background:var(--primary-tint); color:var(--primary); display:grid; place-items:center; flex-shrink:0}
  .field-ic svg{width:18px; height:18px}
  .field-ic.warm{background:var(--warn-tint); color:var(--warn)}
  .field-ic.cold{background:#E7F0FB; color:#215D9C}
  .field-ic.reject{background:var(--blood-tint); color:var(--blood)}
  .field-body{flex:1; min-width:0}
  .field-label{font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:2px}
  .field-val{font-size:14.5px; color:var(--ink); line-height:1.45; word-break:break-word}
  .field-val.mono{font-size:15px; font-weight:700; color:var(--primary-deep)}
  .reject-list{margin:0; padding-left:2px; list-style:none}
  .reject-list li{position:relative; padding-left:16px; margin-bottom:3px; font-size:14px}
  .reject-list li::before{content:"×"; position:absolute; left:0; color:var(--blood); font-weight:700}

  /* ---------- Config / Admin ---------- */
  .cfg-tabs{display:flex; gap:6px; padding:12px 20px 0; background:var(--surface); flex-shrink:0}
  .cfg-tab{flex:1; font-size:12.5px; font-weight:700; color:var(--ink-soft); padding:9px 6px; border-radius:10px 10px 0 0; text-align:center; border-bottom:2px solid transparent}
  .cfg-tab.active{color:var(--primary); border-bottom-color:var(--primary); background:var(--primary-tint)}
  .form-row{margin-bottom:13px}
  .form-row label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px}
  .tubo-quitar-link{background:none; border:none; padding:0; font-size:12px; font-weight:600; color:var(--blood); text-decoration:underline; cursor:pointer}
  .form-row .hint{font-size:11px; color:var(--ink-faint); font-weight:400; margin-top:4px}
  .inp, .sel, .txt{
    width:100%; border:1.5px solid var(--line-strong); border-radius:var(--r-sm);
    padding:11px 12px; background:var(--surface); color:var(--ink); outline:none; transition:border-color .15s;
  }
  .inp:focus,.sel:focus,.txt:focus{border-color:var(--primary)}
  .txt{resize:vertical; min-height:64px; line-height:1.5}
  .form-two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .switch{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 13px; background:var(--surface-2); border-radius:var(--r-sm); border:1px solid var(--line); margin-bottom:10px}
  .switch span{font-size:13.5px; font-weight:600; color:var(--ink)}
  .toggle{width:46px; height:27px; border-radius:20px; background:var(--line-strong); position:relative; flex-shrink:0; transition:background .18s}
  .toggle::after{content:""; position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.2); transition:transform .18s}
  .toggle.on{background:var(--primary)} .toggle.on::after{transform:translateX(19px)}

  .btn{
    display:flex; align-items:center; justify-content:center; gap:7px; width:100%;
    background:var(--primary); color:#fff; font-weight:700; font-size:15px;
    padding:14px; border-radius:var(--r); transition:opacity .12s, transform .08s;
  }
  .btn:active{transform:scale(.99)} .btn:disabled{opacity:.5}
  .btn svg{width:18px; height:18px}
  .btn.ghost{background:var(--surface-2); color:var(--ink); border:1.5px solid var(--line-strong)}
  .btn.danger{background:var(--blood-tint); color:var(--blood)}
  .btn-row{display:flex; gap:10px; margin-top:8px}

  /* admin list of tests */
  .adm-item{display:flex; align-items:center; gap:11px; padding:12px 0; border-bottom:1px solid var(--line)}
  .adm-item .an{flex:1; min-width:0}
  .adm-name{font-weight:700; font-size:14px; font-family:"Archivo",sans-serif}
  .adm-code{font-size:11.5px; color:var(--ink-faint); font-family:"Space Mono",monospace}
  .adm-tubo{display:flex; align-items:center; gap:6px; margin-top:3px; font-size:11.5px;
            color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .adm-tubo .tubo-dot{width:9px; height:9px; margin:0}
  .adm-vol{color:var(--ink-faint)}
  .adm-sin{color:var(--warn); font-weight:600}
  .icon-btn{width:36px; height:36px; border-radius:9px; background:var(--surface-2); color:var(--ink-soft); display:grid; place-items:center; flex-shrink:0}
  .icon-btn svg{width:17px;height:17px}
  .icon-btn.del{color:var(--blood); background:var(--blood-tint)}

  /* Historial de movimientos de sangre */
  .mov-item{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line)}
  .mov-item:last-child{border-bottom:none}
  .mov-badge{font-family:"Space Mono",monospace; font-weight:700; min-width:44px; text-align:center; padding:6px 4px; border-radius:9px; font-size:13.5px; flex-shrink:0}
  .mov-badge.up{background:var(--ok-tint); color:var(--ok)}
  .mov-badge.down{background:var(--blood-tint); color:var(--blood)}
  .mov-body{flex:1; min-width:0}
  .mov-top{display:flex; align-items:baseline; gap:8px}
  .mov-grupo{font-family:"Space Mono",monospace; font-weight:700; font-size:14px; color:var(--ink)}
  .mov-de{font-size:12px; color:var(--ink-faint)}
  .mov-meta{font-size:11.5px; color:var(--ink-faint); margin-top:2px}

  /* blood editor */
  .be-grid{display:grid; grid-template-columns:1fr; gap:8px}
  .be-item{display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:8px 10px}
  .be-type{font-weight:700; min-width:88px; font-size:13.5px; flex-shrink:0}
  .be-item input{width:100%; border:1.5px solid var(--line-strong); border-radius:8px; padding:8px; text-align:center; font-weight:700; font-family:"Archivo",sans-serif}
  .stepper{display:flex; align-items:center; gap:6px; flex:1}
  .stepper button{width:32px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--line-strong);font-size:18px;font-weight:700;color:var(--primary);flex-shrink:0}

  /* login */
  .lock-ic{width:56px; height:56px; border-radius:16px; background:var(--primary-tint); color:var(--primary); display:grid; place-items:center; margin:4px auto 14px}
  .lock-ic svg{width:28px;height:28px}

  /* Pantalla de carga inicial */
  .splash{
    position:fixed; inset:0; z-index:500; background:var(--paper);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
    transition:opacity .35s ease, visibility .35s ease;
  }
  .splash.oculto{opacity:0; visibility:hidden; pointer-events:none}
  .splash-logo img{border-radius:18px; box-shadow:0 6px 24px rgba(19,34,30,.14)}
  .splash .spinner{
    width:38px; height:38px; border-radius:50%;
    border:3.5px solid var(--line-strong); border-top-color:var(--primary);
    animation:girar .8s linear infinite;
  }
  @keyframes girar{ to{ transform:rotate(360deg) } }
  .splash-txt{font-size:13.5px; color:var(--ink-soft); font-weight:600; letter-spacing:.02em}

  .toast{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 22px); transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:30px; font-size:13.5px; font-weight:600;
    z-index:200; opacity:0; pointer-events:none; transition:all .25s; box-shadow:var(--shadow-lg); max-width:90vw;
  }
  .toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--blood)}

  /* Aviso importante (opcional, editable desde Ajustes) */
  .alerta{
    display:flex; gap:12px; align-items:flex-start; margin:14px 0 0;
    background:#FDECEC; border:1.5px solid #F2C2C2; border-left:5px solid var(--blood);
    border-radius:var(--r); padding:13px 15px;
  }
  .alerta .ic{
    width:32px; height:32px; border-radius:9px; background:var(--blood); color:#fff;
    display:grid; place-items:center; flex-shrink:0; margin-top:1px;
  }
  .alerta .ic svg{width:19px; height:19px}
  .alerta .tx{flex:1; min-width:0}
  .alerta .tt{
    font-family:"Archivo",sans-serif; font-weight:800; font-size:12px; letter-spacing:.09em;
    text-transform:uppercase; color:var(--blood); margin-bottom:3px;
  }
  .alerta .ms{font-size:14.5px; color:#5E1A1D; line-height:1.5; white-space:pre-wrap; font-weight:500}

  .mode-flag{
    display:flex; align-items:center; gap:8px; font-size:12px; color:var(--warn);
    background:var(--warn-tint); border:1px solid #F0DCA8; border-radius:10px; padding:9px 12px; margin:12px 0 2px;
  }
  .mode-flag svg{width:16px;height:16px;flex-shrink:0}
  .divider{height:1px; background:var(--line); margin:18px 0}
  .sec-label{font-family:"Archivo",sans-serif; font-weight:700; font-size:13px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin:2px 0 10px}
</style>
</head>
<body>

<!-- Pantalla de carga: se muestra hasta que la app pinta el contenido -->
<div id="splash" class="splash">
  <div class="splash-logo">
    <img src="icon-192.png?v=9" alt="" width="76" height="76"
         onerror="this.style.display='none'">
  </div>
  <div class="spinner" aria-label="Cargando"></div>
  <div class="splash-txt">Cargando portafolio…</div>
</div>

<!-- ====================== HEADER ====================== -->
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="logo" id="logoBox">
        <!-- Logo placeholder (reemplazable desde Ajustes) -->
        <svg viewBox="0 0 48 48" fill="none"><path d="M24 6v36M6 24h36" stroke="#0CC0DF" stroke-width="6" stroke-linecap="round"/></svg>
      </div>
      <div class="titles">
        <p class="eyebrow">Portafolio de pruebas</p>
        <h1 class="brand" id="hName">Laboratorio Clínico</h1>
        <div class="subbrand" id="hSub">Hospital Departamental San Rafael de Zarzal</div>
      </div>
      <button class="gear" id="gearBtn" aria-label="Configuración">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>

    <!-- Reserva de sangre -->
    <div class="blood">
      <div class="blood-head">
        <svg class="blood-drop" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10 12 2.5 12 2.5z"/></svg>
        <span class="blood-title">Reserva de sangre</span>
        <button class="blood-edit" id="bloodEditBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Actualizar
        </button>
      </div>
      <div class="blood-total" id="bloodTotal"></div>
      <div class="blood-primary" id="bloodPrimary"></div>
      <div class="blood-rest" id="bloodRest"></div>

/* ---------- Datos de ejemplo (reemplázalos con los reales) ----------

const SEMILLA = [];  // Los datos se cargan con importar.html a Firestore

/* ====================== ESTADO ====================== */
let USA_FIREBASE = !!firebaseConfig.projectId;
let db = null;
let pruebas = [];
let sangre = { unidades:{}, reservadas:{}, actualizado:null, por:"" };
let movimientos = [];
let cfg = { clave:CLAVE_POR_DEFECTO, claveLab:CLAVE_LAB_POR_DEFECTO, logoUrl:"", notaImportante:"",
  modoInicio:"todos", destacados:[],
  tubos:[

let serviciosEdit = [];

let filtroSecciones = new Set();   // secciones elegidas (vacío = todas)

let accionTrasLogin = null;

/* almacenamiento local seguro (envuelto en try/catch) */
const store = {
  get(k, def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ====================== ARRANQUE ====================== */
/* Ojo: init() se invoca al FINAL del script, cuando ya están
   declaradas todas las constantes (GRUPOS_PPAL, DIAS, IC…). */
async function init(){
  sangre.reservadas = sangre.reservadas || {};
  GRUPOS.forEach(g => { if(sangre.unidades[g]===undefined) sangre.unidades[g]=0;
                        if(sangre.reservadas[g]===undefined) sangre.reservadas[g]=0; });

  // 1) Pintar de inmediato con la última información guardada en el equipo.
  //    Así la app abre al instante, incluso sin señal, y no se ve en blanco.
  cargarLocal();
  aplicarCfg();
  render();
  // Si ya había datos guardados, quitamos el spinner de inmediato.
  // Si no (primera vez / caché vacía), lo dejamos girando hasta que lleguen.
  if(pruebas.length) ocultarSplash();

  if(!USA_FIREBASE){
    ocultarSplash();
    flag('Modo local — configura Firebase en el código para ver la info "en vivo" en todos los servicios.');
    return;
  }

  // 2) Conectar y actualizar en segundo plano.
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    // Firestore guarda su propia copia: responde al instante y aguanta sin señal
    try{ await db.enablePersistence({ synchronizeTabs:true }); }catch(e){ /* ya activa o varias pestañas */ }
    escucharFirebase();
    flag(navigator.onLine ? "" : "Sin conexión — se muestra la última información guardada.");
  }catch(e){
    console.error(e);
    USA_FIREBASE = false;
    flag("Sin conexión con el servidor — se muestra la última información guardada.");
  }
}

/* Permitir que la pantalla gire libremente.
   Algunas tablets conservan el bloqueo con el que se instaló la app. */
try{
  if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
}catch(e){ /* el navegador no lo permite o no hace falta */ }

/* Avisar cuando se recupera o se pierde la señal */
window.addEventListener("online",  ()=> flag(""));
window.addEventListener("offline", ()=> flag("Sin conexión — se muestra la última información guardada."));

function cargarLocal(){
  pruebas = store.get("lab_pruebas", null) || SEMILLA.slice();
  sangre  = store.get("lab_sangre", null) || sangre;
  movimientos = store.get("lab_movimientos", []) || [];
  cfg     = Object.assign(cfg, store.get("lab_cfg", {}));
  migrarClaves();
  sangre.reservadas = sangre.reservadas || {};
  GRUPOS.forEach(g => { if(sangre.unidades[g]===undefined) sangre.unidades[g]=0;
                        if(sangre.reservadas[g]===undefined) sangre.reservadas[g]=0; });
}
// Ajusta datos guardados por versiones anteriores de la app
function migrarClaves(){
  if(!cfg.clave || cfg.clave === "lab123") cfg.clave = CLAVE_POR_DEFECTO;
  if(!cfg.claveLab || cfg.claveLab === "lab456") cfg.claveLab = CLAVE_LAB_POR_DEFECTO;
  // "Tapa amarilla (gel/SST)" pasó a llamarse "Tapa amarilla (gel)"
  const VIEJO = "Tapa amarilla (gel/SST)", NUEVO = "Tapa amarilla (gel)";
  if(Array.isArray(cfg.tubos)) cfg.tubos.forEach(t=>{ if(t.n === VIEJO) t.n = NUEVO; });
  if(!USA_FIREBASE && Array.isArray(pruebas))
    pruebas.forEach(p=>{ if(p.tubo === VIEJO) p.tubo = NUEVO; });
}

function guardarLocal(){
  store.set("lab_pruebas", pruebas);
  store.set("lab_sangre", sangre);
  store.set("lab_movimientos", movimientos);
  store.set("lab_cfg", cfg);
}

/* ---- Firebase en tiempo real ---- */
function escucharFirebase(){
  db.collection("pruebas").orderBy("nombre").onSnapshot(s=>{
    // Evita vaciar la pantalla si llega un resultado vacío desde la caché de Firestore
    if(s.empty && s.metadata.fromCache && pruebas.length) return;
    pruebas = s.docs.map(d=>({id:d.id, ...d.data()}));
    store.set("lab_pruebas", pruebas);        // queda listo para la próxima apertura
    render();
    ocultarSplash();
  }, err=>{ console.error(err); flag("Sin conexión — se muestra la última información guardada."); });

  db.collection("movimientos").orderBy("fecha","desc").limit(300).onSnapshot(s=>{
    movimientos = s.docs.map(d=>({id:d.id, ...d.data()}));
    store.set("lab_movimientos", movimientos);
    if(cfgTab==="sangre") renderCfg();
  }, err=>console.error(err));

  db.collection("config").doc("sangre").onSnapshot(d=>{
    if(d.exists){ const x=d.data(); sangre.unidades=x.unidades||{}; sangre.reservadas=x.reservadas||{}; sangre.actualizado=x.actualizado||null; sangre.por=x.por||""; }
    sangre.reservadas = sangre.reservadas || {};
    GRUPOS.forEach(g=>{ if(sangre.unidades[g]===undefined) sangre.unidades[g]=0;
                        if(sangre.reservadas[g]===undefined) sangre.reservadas[g]=0; });
    store.set("lab_sangre", sangre);
    renderSangre();
  }, err=>console.error(err));

  db.collection("config").doc("general").onSnapshot(d=>{
    if(d.exists) cfg = Object.assign(cfg, d.data());
    migrarClaves();
    store.set("lab_cfg", cfg);
    aplicarCfg();
  }, err=>console.error(err));
}
async function sembrarFirebase(){
  const batch = db.batch();
  SEMILLA.forEach(p=>{ const {id,...data}=p; batch.set(db.collection("pruebas").doc(id), data); });
  await batch.commit();
}

function flag(msg){
  const el = document.getElementById("modeFlag");
  if(!msg){ el.innerHTML=""; return; }
  el.innerHTML = `<div class="mode-flag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span>${esc(msg)}</span></div>`;
}

/* Oculta la pantalla de carga una vez que ya hay algo en pantalla */
let splashFuera = false;
function ocultarSplash(){
  if(splashFuera) return;
  splashFuera = true;
  const sp = document.getElementById("splash");
  if(sp){ sp.classList.add("oculto"); setTimeout(()=>sp.remove(), 400); }
}

/* ====================== RENDER ====================== */
function render(){ aplicarCfg(); renderSangre(); renderFiltros(); renderLista(); }

function aplicarCfg(){
  document.getElementById("hName").textContent = cfg.nombre || "Laboratorio Clínico";
  document.getElementById("hSub").textContent  = cfg.sub || "";
  const box = document.getElementById("logoBox");

  renderNota();
}

// Aviso importante: solo se dibuja si hay texto
function renderNota(){
  const cont = document.getElementById("notaBox");
  if(!cont) return;
  const txt = (cfg.notaImportante || "").trim();
  if(!txt){ cont.innerHTML = ""; return; }
  cont.innerHTML = `<div class="alerta" role="alert">
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div>
    <div class="tx"><div class="tt">Importante</div><div class="ms">${esc(txt)}</div></div>
  </div>`;
}

const GRUPOS_PPAL = ["O+","O-"];
const ETIQUETA_GRUPO = {"O+":"O Positivo", "O-":"O Negativo"};
function etiquetaGrupo(g){ return ETIQUETA_GRUPO[g] || g; }
const GRUPOS_RESTO = ["A+","A-","B+","B-","AB+","AB-"];
function estadoSangre(n){ if(n<=0) return "none"; if(n<=UMBRAL_BAJO) return "low"; return "ok"; }

function reservadasDe(g){
  const r = (sangre.reservadas || {})[g] || 0;
  return Math.min(r, sangre.unidades[g] || 0);   // nunca más de las que hay
}

function renderSangre(){
  const total = GRUPOS.reduce((a,g)=>a+(sangre.unidades[g]||0),0);
  const totalRes = GRUPOS.reduce((a,g)=>a+reservadasDe(g),0);
  const libres = total - totalRes;

  document.getElementById("bloodTotal").innerHTML =
    `<span class="num">${total}</span><span class="lbl">${total===1?'unidad en stock':'unidades en stock'}</span>`
    + (totalRes ? `<br><span style="color:#FFD9D9;font-weight:600">${libres} de libre disposición</span>` : '')
    + `</span>`;

  const candado = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;

  document.getElementById("bloodPrimary").innerHTML = GRUPOS_PPAL.map(g=>{
    const n = sangre.unidades[g]||0, r = reservadasDe(g);
    return `<div class="bg-big" data-st="${estadoSangre(n)}">
      ${r?`<span class="bg-res" title="${r} reservada${r>1?'s':''} para urgencia vital">${candado}${r}</span>`:""}
      <div class="bg-type">${etiquetaGrupo(g)}</div><div class="bg-count">${n}</div>
      <div class="bg-unit">${n===1?'unidad':'unidades'}</div></div>`;
  }).join("");

  document.getElementById("bloodRest").innerHTML = GRUPOS_RESTO.map(g=>{
    const n = sangre.unidades[g]||0, r = reservadasDe(g);
    return `<div class="bg-sm" data-st="${estadoSangre(n)}">
      ${r?`<span class="bg-res" title="${r} reservada${r>1?'s':''} para urgencia vital">${r}</span>`:""}
      <div class="bg-type">${g}</div><div class="bg-count">${n}</div></div>`;
  }).join("");

  // Aviso de las unidades restringidas
  const cont = document.getElementById("bloodReserva");
  if(cont){
    const conRes = GRUPOS.filter(g=>reservadasDe(g)>0);
    if(!conRes.length){ cont.innerHTML = ""; }
    else{
      const detalle = conRes.map(g=>{
        const r = reservadasDe(g);
        return `<b>${r}</b> ${etiquetaGrupo(g)}`;
      });
      const lista = detalle.length===1 ? detalle[0]
        : detalle.slice(0,-1).join(", ") + " y " + detalle[detalle.length-1];
      cont.innerHTML = `<div class="reserva-nota">
        <div class="ic">${candado}</div>
        <div class="tx">
          <div class="t1">Reserva restringida</div>
          <div class="t2">${lista} ${totalRes===1?'está separada':'están separadas'} únicamente para
            <b>cirugía o urgencia vital</b>. No disponer de ${totalRes===1?'ella':'ellas'} sin autorización.</div>
        </div></div>`;
    }
  }

  let t = sangre.actualizado
    ? (()=>{ const f=new Date(sangre.actualizado);
        let s=`Actualizado ${f.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})} · ${f.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}`;
        if(sangre.por) s+=` · ${esc(sangre.por)}`; return s; })()
    : "Sin actualizar todavía";
  document.getElementById("bloodMeta").innerHTML = `<span>${t}</span>`;
}

function secciones(){ return ["Todos", ...seccionesActuales()]; }
function seccionesActuales(){
  // Si hay un orden definido en Ajustes, se respeta; las secciones que
  // aparezcan en pruebas pero no estén listadas se agregan al final (A-Z).
  const orden = cfg.secciones || [];
  if(orden.length){
    const enPruebas = new Set(pruebas.map(p=>p.seccion).filter(Boolean));
    const extra = [...enPruebas].filter(x=>!orden.includes(x)).sort((a,b)=>a.localeCompare(b));
    return [...orden.filter(x=>enPruebas.has(x) || true), ...extra];
  }
  return seccionesAuto();
}
function seccionesAuto(){
  const usadas = new Set(pruebas.map(p=>p.seccion).filter(Boolean));
  (cfg.secciones || []).forEach(x=>usadas.add(x));   // incluye las creadas aunque estén vacías
  return Array.from(usadas).sort((a,b)=>a.localeCompare(b));
}
// Cuántos filtros hay activos (para el globito del botón)
function filtrosActivos(){
  let n = filtroSecciones.size;
  if(filtroEstado !== "todas") n += 1;
  return n;
}

function renderFiltros(){
  // El botón: muestra cuántos filtros hay puestos
  const badge = document.getElementById("filtroBadge");
  const btn = document.getElementById("filtroBtn");
  if(badge && btn){
    const n = filtrosActivos();
    badge.textContent = n ? n : "";
    badge.style.display = n ? "grid" : "none";
    btn.classList.toggle("con-filtros", n>0);
  }
  // Los chips activos que se ven al lado del botón
  renderFiltroActivos();
  // Si el panel está abierto, redibujarlo
  if(filtroPanelAbierto) renderFiltroPanel();
}

function renderFiltroActivos(){
  const cont = document.getElementById("filtroActivos");
  if(!cont) return;
  const chips = [];
  if(filtroEstado === "procesando") chips.push(["estado","Procesando"]);
  if(filtroEstado === "suspendidas") chips.push(["estado","No disponibles"]);
  filtroSecciones.forEach(s=> chips.push(["sec:"+s, s]));
  cont.innerHTML = chips.map(([k,txt])=>
    `<button class="chip-activo" onclick="quitarFiltro('${esc(k)}')">${esc(txt)}
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>`).join("");
}

function quitarFiltro(k){
  if(k === "estado") filtroEstado = "todas";
  else if(k.startsWith("sec:")) filtroSecciones.delete(k.slice(4));
  renderFiltros();
  renderLista();
}

function toggleFiltroPanel(){
  filtroPanelAbierto = !filtroPanelAbierto;
  const panel = document.getElementById("filtroPanel");
  panel.classList.toggle("abierto", filtroPanelAbierto);
  if(filtroPanelAbierto) renderFiltroPanel();
}

function renderFiltroPanel(){
  const panel = document.getElementById("filtroPanel");
  if(!panel) return;
  const nSusp = pruebas.filter(p=>p.suspendida).length;
  const secs = seccionesActuales();

  let html = "";

  // Grupo: estado (solo si hay suspendidas)
  if(nSusp){
    const ops = [["todas","Todas"],["procesando","Procesando"],["suspendidas",`No disponibles (${nSusp})`]];
    html += `<div class="fp-grupo">
      <div class="fp-titulo">Estado</div>
      <div class="fp-opts">${ops.map(([v,txt])=>
        `<button class="fp-op ${filtroEstado===v?'on':''}" onclick="setEstado('${v}')">${esc(txt)}</button>`
      ).join("")}</div>
    </div>`;
  }

  // Grupo: áreas (selección múltiple)
  if(secs.length){
    html += `<div class="fp-grupo">
      <div class="fp-titulo">Áreas o secciones <span class="fp-multi">elige una o varias</span></div>
      <div class="fp-opts">${secs.map(s=>
        `<button class="fp-op ${filtroSecciones.has(s)?'on':''}" onclick="toggleSeccion('${esc(s)}')">${esc(s)}</button>`
      ).join("")}</div>
    </div>`;
  }

  // Pie: limpiar / listo
  html += `<div class="fp-pie">
    <button class="fp-limpiar" onclick="limpiarFiltros()">Limpiar filtros</button>
    <button class="fp-listo" onclick="toggleFiltroPanel()">Listo</button>
  </div>`;

  panel.innerHTML = html;
}

function setEstado(v){
  filtroEstado = v;
  renderFiltros();
  renderLista();
}

function toggleSeccion(s){
  if(filtroSecciones.has(s)) filtroSecciones.delete(s);
  else filtroSecciones.add(s);
  renderFiltros();
  renderLista();
}

function limpiarFiltros(){
  filtroSecciones.clear();
  filtroEstado = "todas";
  renderFiltros();
  renderLista();
}

// Normaliza: quita tildes/diacríticos y pasa a minúscula
function normalizar(s){
  return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}
function filtradas(){
  const q = normalizar(termino.trim());
  return pruebas.filter(p=>{
    if(filtroSecciones.size && !filtroSecciones.has(p.seccion)) return false;
    if(filtroEstado==="procesando" && p.suspendida) return false;
    if(filtroEstado==="suspendidas" && !p.suspendida) return false;
    if(!q) return true;
    return normalizar([p.nombre,p.cups,p.sinonimos,p.seccion].filter(Boolean).join(" ")).includes(q);
  }).sort((a,b)=>{
    // Primero las que se están procesando; las suspendidas van al final.
    const sa = a.suspendida ? 1 : 0, sb = b.suspendida ? 1 : 0;
    if(sa !== sb) return sa - sb;
    return (a.nombre||"").localeCompare(b.nombre||"");
  });
}

function renderLista(){
  const list = document.getElementById("list");
  let res = filtradas();

  // ¿Vista inicial reducida a las pruebas destacadas?
  const vistaInicial = !termino.trim() && filtroSecciones.size===0 && filtroEstado==="todas";
  const modoDestacados = (cfg.modoInicio === "destacados");
  const destacadosOn = vistaInicial && modoDestacados;
  const total = pruebas.length;
  if(destacadosOn){
    const ids = cfg.destacados || [];
    res = res.filter(p=>ids.includes(p.id));
  }

  const cl = document.getElementById("countLine");
  if(destacadosOn){
    cl.innerHTML = res.length
      ? `${res.length} ${res.length===1?"prueba destacada":"pruebas destacadas"} · <span style="color:var(--ink-soft)">busca por nombre o CUPS para ver las ${total} pruebas</span>`
      : `<span style="color:var(--ink-soft)">Busca por nombre o código CUPS entre las ${total} pruebas del portafolio.</span>`;
  }else{
    cl.textContent = res.length + (res.length===1?" prueba":" pruebas") + (termino?` para "${termino}"`:"");
  }

  if(res.length===0 && destacadosOn){
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <h3>Busca una prueba</h3>
      <p>Escribe el nombre o el código CUPS en el buscador.</p></div>`;
    return;
  }
  if(res.length===0){
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <h3>Sin resultados</h3>
      <p>No encontramos pruebas para esa búsqueda.</p></div>`;
    return;
  }
  list.innerHTML = res.map(p=>{
    let badges = "";
    if(p.seccion) badges += `<span class="badge b-sec">${esc(p.seccion)}</span>`;
    badges += p.remite
      ? `<span class="badge b-ref"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Se remite</span>`
      : `<span class="badge b-here"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>Se procesa aquí</span>`;
    const cons = p.conservacion || (p.refrigeracion ? "refrigeracion" : "ambiente");
    if(cons==="refrigeracion") badges += `<span class="badge b-cold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M4 7l16 10M20 7 4 17"/></svg>Refrigerar</span>`;
    else if(cons==="congelacion") badges += `<span class="badge b-freeze"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M4 7l16 10M20 7 4 17M2 12h20"/></svg>Congelar</span>`;
    if(p.soloExclusivo && p.servicios && p.servicios.length) badges += `<span class="badge b-lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Servicios limitados</span>`;
    if(Array.isArray(p.diasProceso) && p.diasProceso.length && p.diasProceso.length<7)
      badges += `<span class="badge b-days"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>${DIAS.filter(d=>p.diasProceso.includes(d.k)).map(d=>d.n).join(" · ")}</span>`;
    if(p.tiempoResultado) badges += `<span class="badge b-time">⏱ ${esc(p.tiempoResultado)}</span>`;

    if(p.suspendida) badges = `<span class="badge b-susp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>No disponible</span>` + badges;
    return `<button class="test ${p.suspendida?'susp':''}" data-id="${p.id}">
      <div class="test-top">
        <div class="test-name">${esc(p.nombre)}</div>
        ${p.cups?`<span class="cups">${esc(p.cups)}</span>`:""}
      </div>
      <div class="test-badges">${badges}</div>
    </button>`;
  }).join("");

  // Separador visual: si en la vista aparecen ambos grupos, marcar dónde empiezan las no disponibles
  if(filtroEstado === "todas"){
    const idx = res.findIndex(p=>p.suspendida);
    if(idx > 0){
      const items = list.children;
      if(items[idx]){
        const sep = document.createElement("div");
        sep.className = "sep-susp";
        sep.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg> No disponibles temporalmente`;
        list.insertBefore(sep, items[idx]);
      }
    }
  }
}

// Días de la semana para pruebas que se corren por lotes
const DIAS = [
  {k:"LU", n:"Lunes"}, {k:"MA", n:"Martes"}, {k:"MI", n:"Miércoles"},
  {k:"JU", n:"Jueves"}, {k:"VI", n:"Viernes"}, {k:"SA", n:"Sábado"}, {k:"DO", n:"Domingo"}
];
function nombresDias(keys){
  const ns = DIAS.filter(d=>keys.includes(d.k)).map(d=>d.n);
  if(ns.length===1) return ns[0];
  if(ns.length===2) return ns[0]+" y "+ns[1];
  return ns.slice(0,-1).join(", ")+" y "+ns[ns.length-1];
}

  const dias = Array.isArray(p.diasProceso) ? p.diasProceso.filter(Boolean) : [];
  if(!dias.length) return "";
  const soloUno = dias.length===1;
  const titulo = `Se procesa ${soloUno?'solo los':'los'} ${nombresDias(dias)}`;
  const tiempo = p.tiempoResultado || p.tiempoTrasProceso || "";
  const after = tiempo
    ? `<div class="days-after">Resultado disponible <b>${esc(tiempo)}</b> después del día de procesamiento.</div>`

function bloqueServicios(p){

  return `<div class="svc-block ${excl?'excl':''}">

  sheet.innerHTML = `

      ${nivel==="admin" ? `<button class="x edit-fab" onclick="editarPrueba('${p.id}','detalle')" title="Editar esta prueba"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>` : ""}

        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></div>
        <div><div class="tt">No disponible</div>
        <div class="ms">${esc(p.motivoSuspension || "Esta prueba no se está procesando temporalmente. Consulta con el laboratorio antes de tomar la muestra.")}</div></div>
      </div>`:""}
      ${p.cups?`<div class="field"><div class="field-ic">${IC.cups}</div><div class="field-body"><div class="field-label">Código CUPS</div><div class="field-val mono">${esc(p.cups)}</div></div></div>`:""}
      ${(()=>{

          + (p.volumen?` · <span style="color:var(--ink-soft)">${esc(p.volumen)}</span>`:"");
        return fila(IC.tubo, ts.length>1?"Tubos / recipientes":"Tubo / recipiente", val);

      ${consFila}

      ${(Array.isArray(p.diasProceso) && p.diasProceso.length) ? "" : fila(IC.resultado, "Tiempo de entrega de resultados", esc(p.tiempoResultado||""))}
      ${bloqueDias(p)}

  abrir(sheet);

        <option value="remite" ${admProceso==='remite'?'selected':''}>Solo remitidas</option>
        <option value="dias" ${admProceso==='dias'?'selected':''}>Con días fijos</option>
        <option value="sinCups" ${admProceso==='sinCups'?'selected':''}>Sin código CUPS</option>
        <option value="sinTubo" ${admProceso==='sinTubo'?'selected':''}>Sin recipiente definido</option>
      </select>
    </div>

    <div id="admCount" class="hint" style="margin:0 0 8px"></div>
    <div id="admLista"></div>`;
}

function admFiltradas(){
  const q = normalizar(admBusqueda.trim());
  return pruebas.slice()
    .sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""))
    .filter(p=>{
      if(admSeccion!=="Todas" && p.seccion!==admSeccion) return false;
      if(admProceso==="aqui"    && p.remite) return false;
      if(admProceso==="remite"  && !p.remite) return false;
      if(admProceso==="dias"    && !(Array.isArray(p.diasProceso) && p.diasProceso.length)) return false;
      if(admProceso==="sinCups" && (p.cups||"").trim()) return false;
      if(admProceso==="sinTubo" && tubosDe(p).length) return false;
      if(!q) return true;
      return normalizar([p.nombre,p.cups,p.sinonimos,p.seccion].filter(Boolean).join(" ")).includes(q);
    });
}

function renderAdmLista(){
  const cont = document.getElementById("admLista");
  if(!cont) return;
  const res = admFiltradas();
  const c = document.getElementById("admCount");
  if(c) c.textContent = `${res.length} de ${pruebas.length} ${pruebas.length===1?"prueba":"pruebas"}`;
  cont.innerHTML = res.length ? res.map(p=>{
    const ts = tubosDe(p);
    const tuboHtml = ts.length
      ? ts.map(t=>`<span class="tubo-dot" style="background:${esc(t.c||'#7A6A55')}"></span><span>${esc(t.n)}</span>`).join(' <span class="tubo-plus">+</span> ')
          + (p.volumen?`<span class="adm-vol">· ${esc(p.volumen)}</span>`:"")
      : `<span class="adm-sin">Sin recipiente definido</span>`;
    return `
    <div class="adm-item">
      <div class="an"><div class="adm-name">${esc(p.nombre)}</div>
        <div class="adm-code">${esc(p.cups||"sin CUPS")} · ${esc(p.seccion||"—")}${p.remite?" · remitida":""}</div>
        <div class="adm-tubo">${tuboHtml}</div></div>
      <button class="icon-btn" onclick="editarPrueba('${p.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="icon-btn del" onclick="borrarPrueba('${p.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>`;

    : '<p style="color:var(--ink-faint);text-align:center;padding:22px;font-size:13px">Ninguna prueba coincide con el filtro.</p>';

// Vuelve al detalle de la prueba (edición rápida) o a la lista de administración (edición normal)
function volverDeEdicion(){
  if(edicionOrigen === "detalle" && editandoId){ verDetalle(editandoId); }
  else{ cfgTab='pruebas'; renderCfg(); }
}

// Elimina la prueba que se está editando, pidiendo confirmación antes.
async function eliminarPrueba(){
  if(!editandoId) return;
  const p = pruebas.find(x=>x.id===editandoId);
  const nombre = p ? p.nombre : "esta prueba";
  if(!confirm(`¿Eliminar "${nombre}"?\n\nEsta acción no se puede deshacer.`)) return;

  const id = editandoId;
  if(USA_FIREBASE){
    try{ await db.collection("pruebas").doc(id).delete(); }
    catch(e){ console.error(e); toast("No se pudo eliminar", true); return; }
  }else{
    const i = pruebas.findIndex(x=>x.id===id);
    if(i>=0) pruebas.splice(i,1);
    guardarLocal();
  }
  editandoId = null;
  toast(`"${nombre}" fue eliminada`);
  // cerrar la hoja de detalle si venía de ahí (ya no existe la prueba)
  const sheet = document.getElementById("detailSheet");
  if(sheet) sheet.classList.remove("on");
  cfgTab='pruebas'; renderCfg();
  renderLista();
}

/* --- Hasta 3 tubos por prueba --- */
function filaTubo(idx, t){
  t = t || {n:"", c:""};
  const esOtro = !!(t.n && !(cfg.tubos||[]).some(x=>x.n===t.n));
  const etiquetas = ["Tubo / recipiente","Segundo tubo (opcional)","Tercer tubo (opcional)"];
  const mostrar = idx===0 || !!t.n;
  return `<div class="form-row tubo-slot" id="tuboSlot_${idx}" style="${mostrar?'':'display:none'}">
    <label>${etiquetas[idx]}${idx>0?` · <button type="button" class="tubo-quitar-link" onclick="quitarTuboSlot(${idx})">quitar</button>`:''}</label>
    <select class="sel" id="f_tuboPreset_${idx}" onchange="cambiarTuboPreset(${idx})">
      <option value="">— Sin especificar —</option>
      ${(cfg.tubos||[]).map(x=>`<option value="${esc(x.n)}" data-c="${esc(x.c)}" ${t.n===x.n?'selected':''}>${esc(x.n)}</option>`).join("")}
      <option value="__otro__" ${esOtro?'selected':''}>➕ Otro (solo para este examen)</option>
    </select>
    <div class="form-row" id="tuboOtroBox_${idx}" style="display:${esOtro?'block':'none'}; margin:8px 0 0">
      <div class="color-field">
        <input type="color" id="f_tuboColor_${idx}" value="${esc(t.c||'#8E5BC7')}">
        <input class="inp" id="f_tuboOtro_${idx}" value="${esOtro?esc(t.n||''):''}" placeholder="Ej. Tubo especial para metales">
      </div>
    </div>
  </div>`;
}
function cambiarTuboPreset(idx){
  const sel = document.getElementById("f_tuboPreset_"+idx);
  const box = document.getElementById("tuboOtroBox_"+idx);
  if(!sel || !box) return;
  box.style.display = sel.value === "__otro__" ? "block" : "none";
}
function actualizarBotonTubo(){
  const btn = document.getElementById("btnAgregarTubo");
  if(!btn) return;
  const visibles = [0,1,2].filter(i=>{
    const el = document.getElementById("tuboSlot_"+i);
    return el && el.style.display !== "none";
  }).length;
  if(visibles >= 3){ btn.style.display = "none"; return; }
  btn.style.display = "flex";
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Agregar ${visibles===1?"segundo":"tercer"} tubo`;
}
function agregarTuboSlot(){
  const siguiente = [1,2].find(i=>{
    const el = document.getElementById("tuboSlot_"+i);
    return el && el.style.display === "none";
  });
  if(siguiente===undefined) return;
  document.getElementById("tuboSlot_"+siguiente).style.display = "block";
  actualizarBotonTubo();
}
function quitarTuboSlot(idx){
  const sel = document.getElementById("f_tuboPreset_"+idx);
  if(sel) sel.value = "";
  const box = document.getElementById("tuboOtroBox_"+idx);
  if(box) box.style.display = "none";
  const otro = document.getElementById("f_tuboOtro_"+idx);
  if(otro) otro.value = "";
  document.getElementById("tuboSlot_"+idx).style.display = "none";
  actualizarBotonTubo();
}
function tuboElegidoIdx(idx){
  const sel = document.getElementById("f_tuboPreset_"+idx);
  const slot = document.getElementById("tuboSlot_"+idx);
  if(!sel || !slot || slot.style.display === "none" || !sel.value) return null;
  if(sel.value === "__otro__"){
    const n = (document.getElementById("f_tuboOtro_"+idx)||{}).value || "";
    const c = (document.getElementById("f_tuboColor_"+idx)||{}).value || "";
    return n.trim() ? {n:n.trim(), c} : null;
  }
  const opt = sel.options[sel.selectedIndex];
  return {n:sel.value, c:(opt && opt.dataset.c) || ""};
}
function tubosElegidos(){
  return [0,1,2].map(tuboElegidoIdx).filter(Boolean);
}

// La etiqueta del tiempo cambia según haya o no días marcados
function actualizarPistaTiempo(){
  const lbl = document.getElementById("lblTiempo");
  const hint = document.getElementById("hintTiempo");
  const picker = document.getElementById("dayPicker");
  if(!lbl || !hint || !picker) return;
  const sel = Array.from(picker.querySelectorAll(".day-pick.on")).map(e=>e.dataset.dia);
  if(sel.length){
    lbl.textContent = "Tiempo de resultados después del día de proceso";
    hint.innerHTML = `Se mostrará: “Resultado disponible <b>…</b> después del día de procesamiento (${nombresDias(sel)}).”`;
  }else{
    lbl.textContent = "Tiempo de entrega de resultados";
    hint.textContent = "Se procesa todos los días; el tiempo se cuenta desde que llega la muestra.";
  }
}

async function guardarPrueba(){
  const g = (k)=>{ const e=document.getElementById("f_"+k); return e?e.value.trim():""; };
  const nombre = g("nombre");
  if(!nombre){ toast("El nombre es obligatorio", true); return; }
  const tubosSel = tubosElegidos();
  const data = {
    nombre, cups:g("cups"), seccion:g("seccion"), sinonimos:g("sinonimos"),
    tubos:tubosSel,
    tubo:tubosSel[0]?tubosSel[0].n:"", tuboColor:tubosSel[0]?tubosSel[0].c:"", // compatibilidad con datos antiguos
    volumen:g("volumen"),
    conservacion:(document.getElementById("f_conservacion")||{}).value || "ambiente",
    transporte:g("transporte"), tiempoResultado:g("tiempoResultado"),
    diasProceso:Array.from(document.querySelectorAll("#dayPicker .day-pick.on")).map(e=>e.dataset.dia),
    remite:document.getElementById("f_remite").classList.contains("on"),
    laboratorioRef:g("laboratorioRef"),
    servicios:Array.from(document.querySelectorAll("#svcPicker .svc-opt.on")).map(e=>e.dataset.svc),
    soloExclusivo:!!(document.getElementById("f_exclusivo") && document.getElementById("f_exclusivo").classList.contains("on")),
    preparacion:g("preparacion"), indicacionesLab:g("indicacionesLab"),
    rechazo:g("rechazo"), notas:g("notas"),
    suspendida:document.getElementById("f_suspendida").classList.contains("on"),
    motivoSuspension:g("motivoSuspension")
  };
  if(USA_FIREBASE){
    try{
      if(editandoId) await db.collection("pruebas").doc(editandoId).set(data);
      else await db.collection("pruebas").add(data);
    }catch(e){ toast("Error al guardar", true); return; }
  }else{
    if(editandoId){ const i=pruebas.findIndex(x=>x.id===editandoId); pruebas[i]={id:editandoId,...data}; }
    else pruebas.push({id:"loc"+Date.now(),...data});
    guardarLocal(); render();
  }
  toast(editandoId?"Prueba actualizada":"Prueba agregada");
  if(edicionOrigen === "detalle" && editandoId){ verDetalle(editandoId); }
  else{ cfgTab="pruebas"; renderCfg(); }
}

async function borrarPrueba(id){
  const p = pruebas.find(x=>x.id===id);
  if(!confirm(`¿Eliminar "${p?p.nombre:''}" del portafolio?`)) return;
  if(USA_FIREBASE){ try{ await db.collection("pruebas").doc(id).delete(); }catch(e){ toast("Error al eliminar", true); return; } }
  else{ pruebas = pruebas.filter(x=>x.id!==id); guardarLocal(); render(); }
  toast("Prueba eliminada"); renderCfg();
}

function viewMovimientos(){
  if(!movimientos.length)
    return '<p style="color:var(--ink-faint);text-align:center;padding:16px;font-size:13px">Aún no hay movimientos registrados.</p>';
  return movimientos.map(m=>{
    const f = new Date(m.fecha);
    const signo = m.delta>0 ? "+"+m.delta : ""+m.delta;
    const cls = m.delta>0 ? "up" : "down";
    const fecha = `${f.toLocaleDateString('es-CO',{day:'2-digit',month:'short'})} · ${f.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}`;
    return `<div class="mov-item">
      <div class="mov-badge ${cls}">${signo}</div>
      <div class="mov-body">
        <div class="mov-top"><span class="mov-grupo">${m.grupo}</span><span class="mov-de">${m.previo} → ${m.nuevo} uds</span></div>
        <div class="mov-meta">${fecha}${m.por?` · ${esc(m.por)}`:""}</div>
      </div>
      <button class="icon-btn del" onclick="borrarMovimiento('${m.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>`;
  }).join("");
}
function topeReserva(g){
  const u = document.getElementById("be_"+g), r = document.getElementById("br_"+g);
  if(!u || !r) return;
  const nu = Math.max(0, parseInt(u.value)||0);
  let nr = Math.max(0, parseInt(r.value)||0);
  if(nr > nu){ nr = nu; r.value = nr; }
}

function stepSangre(g, d){
  const inp = document.getElementById("be_"+g);
  inp.value = Math.max(0, (parseInt(inp.value)||0)+d);
  topeReserva(g);
}
async function guardarSangre(){
  const previo = Object.assign({}, sangre.unidades);
  const unidades = {}, reservadas = {};
  GRUPOS.forEach(g=>{
    unidades[g] = Math.max(0, parseInt(document.getElementById("be_"+g).value)||0);
    const r = Math.max(0, parseInt((document.getElementById("br_"+g)||{}).value)||0);
    reservadas[g] = Math.min(r, unidades[g]);
  });
  const por = document.getElementById("be_por").value.trim();
  const ts = Date.now();

  // Detectar cambios por grupo => movimientos
  const movs = [];
  GRUPOS.forEach(g=>{
    const antes = previo[g]||0, ahora = unidades[g]||0;
    if(antes !== ahora) movs.push({ grupo:g, delta:ahora-antes, previo:antes, nuevo:ahora, por, fecha:ts });
  });

  const payload = { unidades, reservadas, actualizado:ts, por };
  if(USA_FIREBASE){
    try{
      await db.collection("config").doc("sangre").set(payload);
      for(const m of movs){ await db.collection("movimientos").add(m); }
    }catch(e){ toast("Error al guardar", true); return; }
  }else{
    sangre = payload;
    movs.forEach((m,i)=>movimientos.unshift(Object.assign({id:"mov"+ts+"_"+m.grupo+i}, m)));
    guardarLocal(); renderSangre();
  }
  toast(movs.length ? `Reserva actualizada · ${movs.length} movimiento${movs.length>1?'s':''}` : "Sin cambios en las unidades");
  renderCfg();
}

async function guardarNota(){
  cfg.notaImportante = document.getElementById("cf_nota").value.trim();
  if(USA_FIREBASE){ try{ await db.collection("config").doc("general").set(cfg); }catch(e){ toast("Error al guardar", true); return; } }
  else{ guardarLocal(); }
  renderNota();
  toast(cfg.notaImportante ? "Aviso publicado" : "Aviso retirado");
}

async function borrarMovimiento(id){
  if(!confirm("¿Eliminar este movimiento del historial? Las unidades actuales NO cambian.")) return;
  if(USA_FIREBASE){ try{ await db.collection("movimientos").doc(id).delete(); }catch(e){ toast("Error al eliminar", true); return; } }
  else{ movimientos = movimientos.filter(m=>m.id!==id); guardarLocal(); }
  toast("Movimiento eliminado"); renderCfg();
}
async function borrarTodosMovimientos(){
  if(!confirm("¿Vaciar todo el historial de movimientos? Las unidades actuales NO cambian.")) return;
  if(USA_FIREBASE){
    try{ const s = await db.collection("movimientos").get();
      const batch = db.batch(); s.docs.forEach(d=>batch.delete(d.ref)); await batch.commit();
    }catch(e){ toast("Error al vaciar", true); return; }
  }else{ movimientos = []; guardarLocal(); }
  toast("Historial vaciado"); renderCfg();
}

function dispFiltradas(){
  const q = normalizar(dispBusca.trim());
  return pruebas.slice().sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||"")).filter(p=>{
    const susp = (p.id in suspEdit) ? suspEdit[p.id] : !!p.suspendida;
    if(dispSeccion!=="Todas" && p.seccion!==dispSeccion) return false;
    if(dispTipo==="aqui"   && p.remite) return false;
    if(dispTipo==="remite" && !p.remite) return false;
    if(dispTipo==="susp"   && !susp) return false;
    if(dispTipo.startsWith("lab::") && p.laboratorioRef !== dispTipo.slice(5)) return false;
    if(!q) return true;
    return normalizar([p.nombre,p.cups,p.sinonimos].filter(Boolean).join(" ")).includes(q);
  });
}
function renderDispLista(){
  const cont = document.getElementById("dispLista");
  if(!cont) return;
  const res = dispFiltradas();
  const tick = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>`;
  const nSusp = pruebas.filter(p=>(p.id in suspEdit)?suspEdit[p.id]:!!p.suspendida).length;
  const c = document.getElementById("dispCount");
  if(c) c.innerHTML = `${res.length} visibles · <b style="color:var(--blood)">${nSusp} suspendidas</b> en total`;
  cont.innerHTML = res.length ? res.map(p=>{
    const susp = (p.id in suspEdit) ? suspEdit[p.id] : !!p.suspendida;
    return `<div class="disp-item ${susp?'on':''}" onclick="alternarSusp('${p.id}')">
      <span class="tick">${tick}</span>
      <span class="dn">${esc(p.nombre)}</span>
      <span class="dc">${esc(p.cups||"")}</span></div>`;
  }).join("") : '<p style="font-size:12.5px;color:var(--ink-faint);text-align:center;padding:18px">Sin coincidencias.</p>';
}
function alternarSusp(id){
  const p = pruebas.find(x=>x.id===id); if(!p) return;
  const actual = (id in suspEdit) ? suspEdit[id] : !!p.suspendida;
  suspEdit[id] = !actual;

function atajoRemitidas(valor){
  pruebas.forEach(p=>{ if(p.remite) suspEdit[p.id] = valor; });

              : "Todas las remitidas quedaron marcadas como disponibles");

  dispFiltradas().forEach(p=>{ suspEdit[p.id] = valor; });
